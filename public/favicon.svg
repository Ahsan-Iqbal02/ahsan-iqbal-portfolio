  <!-- Text AI -->
  <text x="30" y="42" font-family="'Inter', 'Segoe UI', system-ui, sans-serif" font-weight="900" font-size="28" fill="url(#cyanGrad)" text-anchor="middle" letter-spacing="-1">AI</text>
